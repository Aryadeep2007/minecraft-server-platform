name: Bug report
description: Report a reproducible issue in checked-in project code or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private keys, private IP/MAC addresses, tunnel identifiers, or player personal data. Redact logs before attaching them.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web dashboard
        - Paper bridge
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant versions
      description: Include only versions needed to understand the issue.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove secrets, private addresses, and personal/player information.
    validations:
      required: false
